<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그 여행 질문</title>
<style>
  :root { --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --bg: #fff; --card: #f5f5f7; --accent: #0a66c2; --err: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --bg: #111; --card: #1c1c1e; --accent: #4ea1ff; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  form { display: flex; gap: 8px; }
  input, textarea { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  textarea { resize: vertical; min-height: 44px; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin: 16px 0; }
  .q { font-weight: 600; }
  .a { white-space: pre-wrap; background: var(--card); padding: 12px 14px; border-radius: 8px; margin-top: 6px; }
  .sources { font-size: .9rem; color: var(--muted); margin-top: 6px; }
  .sources a { color: var(--accent); }
  .error { color: var(--err); }
  .hint { color: var(--muted); font-size: .9rem; }
  #chat-form { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--line); }
  #chat-form > div { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
</style>
</head>
<body>
<main>
  <h1>블로그 여행 질문</h1>

  <section id="login">
    <p class="hint">받은 접근 코드를 입력하세요.</p>
    <form id="code-form">
      <label for="code" hidden>접근 코드</label>
      <input id="code" name="code" autocomplete="off" required>
      <button type="submit">입장</button>
    </form>
    <p id="login-error" class="error" role="alert"></p>
  </section>

  <section id="chat" hidden>
    <div id="log" aria-live="polite"></div>
  </section>
</main>

<form id="chat-form" hidden>
  <div>
    <label for="question" hidden>질문</label>
    <textarea id="question" rows="1" placeholder="예: 튀르키예를 어떤 순서로 이동했어?" required></textarea>
    <button type="submit" id="send">보내기</button>
  </div>
</form>

<script>
const $ = (id) => document.getElementById(id);

function showChat() {
  $("login").hidden = true;
  $("chat").hidden = false;
  $("chat-form").hidden = false;
  $("question").focus();
}

$("code-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("login-error").textContent = "";
  const res = await fetch("/api/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: $("code").value }),
  });
  if (res.ok) showChat();
  else $("login-error").textContent = res.status === 401 ? "코드가 맞지 않거나 만료됐습니다." : "잠시 뒤 다시 시도해 주세요.";
});

// SSE 한 덩어리("event: x\ndata: {...}")를 {event, data}로 바꾼다.
function parseEvent(block) {
  let event = "message", data = "";
  for (const line of block.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  return { event, data: data ? JSON.parse(data) : null };
}

function addMessage(question) {
  const wrap = document.createElement("div");
  wrap.className = "msg";
  const q = document.createElement("div");
  q.className = "q";
  q.textContent = question;
  const a = document.createElement("div");
  a.className = "a";
  const s = document.createElement("div");
  s.className = "sources";
  wrap.append(q, a, s);
  $("log").append(wrap);
  return { a, s };
}

function showSources(el, sources) {
  if (!sources.length) return;
  el.append("근거: ");
  sources.forEach((src, i) => {
    const link = document.createElement("a");
    link.href = src.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = src.title;
    if (i) el.append(", ");
    el.append(link);
  });
}

$("chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("question").value.trim();
  if (!question) return;
  $("question").value = "";
  $("send").disabled = true;
  const { a, s } = addMessage(question);
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) {
      const messages = { 401: "세션이 만료됐습니다. 새로고침 후 코드를 다시 입력하세요.", 429: "오늘 질문 한도를 다 썼습니다." };
      a.textContent = messages[res.status] || "잠시 뒤 다시 시도해 주세요.";
      a.classList.add("error");
      return;
    }
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value.replace(/\r\n/g, "\n");
      let end;
      while ((end = buffer.indexOf("\n\n")) >= 0) {
        const { event, data } = parseEvent(buffer.slice(0, end));
        buffer = buffer.slice(end + 2);
        if (event === "token") a.textContent += data.text;
        else if (event === "sources") showSources(s, data);
        else if (event === "error") { a.textContent += data.message; a.classList.add("error"); }
      }
    }
  } catch {
    a.textContent += "\n연결이 끊겼습니다.";
    a.classList.add("error");
  } finally {
    $("send").disabled = false;
    $("question").focus();
  }
});

$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("chat-form").requestSubmit();
  }
});
</script>
</body>
</html>
